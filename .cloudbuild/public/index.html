<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物业不动产租赁管理系统</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app"></div>

<!-- 登录页 -->
<div id="loginPage" class="login-page" style="display:none">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-logo">租</div>
      <div>
        <h1>物业不动产租赁管理系统</h1>
        <p>合同 · 房源 · 收费 · 发票 · 审批 · 巡检</p>
      </div>
    </div>
    <form id="loginForm" autocomplete="off">
      <label>登录账号</label>
      <input type="text" id="loginUser" value="admin" placeholder="请输入账号">
      <label>登录密码</label>
      <input type="password" id="loginPwd" value="123456" placeholder="请输入密码">
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登 录</button>
      <div class="login-tip">
        演示账号：admin / zhaoshang / caiwu / chunafp / gongcheng / kefu，密码统一 123456
      </div>
      <div class="login-tip" style="margin-top:8px">
        <a href="/m.html" style="color:var(--primary)">→ 进入移动端（巡检 / 抄表 / 待办）</a>
      </div>
    </form>
  </div>
</div>

<script src="/js/core.js"></script>
<script src="/js/components.js"></script>
<script src="/js/views.js"></script>
<script src="/js/views2.js"></script>
<script src="/js/views3.js"></script>
<script src="/js/views4.js"></script>
<script src="/js/views5.js"></script>
<script src="/js/views6.js"></script>

<script src="/js/app.js"></script>
</body>
</html>
