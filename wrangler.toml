name = "property-lease"
type = "webpack"
account_id = "e439e99286c6e2b1b433900c76366a8c"
compatibility_date = "2024-01-01"

[build]
command = "echo 'No build required'"
publish = "public"

[build.environment]
NODE_VERSION = "20"

# 环境变量（敏感信息建议用 wrangler secret 设置）
[vars]
ATT_STORAGE = "qiniu"
QINIU_REGION = "z0"
DB_MODE = "cloud"

# 函数配置
[functions]
# 使用 Netlify 函数格式（兼容）
directory = "netlify/functions"

# 路由规则
[[rules]]
type = "JavaScript"
globs = ["**/*.js"]
fallthrough = true
